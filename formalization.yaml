version: "v0.4"
project:
  name: Valuation Integers
  description: >-
    Power divisibility and a Krull-dimension bound for the integers of a
    rank-at-most-one valuation, a converse producing rank data from a
    dimension bound, and intersections of valuation subrings with full
    residue-field maps. Finite rank-at-most-one intersections have classified
    primes, dimension at most one and finite spectra whose nonempty opens
    contain zero. Finite pairwise inequivalent rank-one intersections have a
    separately hypothesized generic-point fork homeomorphism. Equivalent
    surjective valuations of a ring into a common cyclic-unit linearly ordered
    commutative group with zero are equal. A canonical rank-at-most-one
    valuative topology detects values less than one by convergence of powers;
    for division rings, the specified identity homeomorphism recognizes
    equivalence of two rank-at-most-one valuations. Valuations of rank at most
    one on division rings also have a real absolute-value construction using
    the specified rank embedding, with comparison lemmas including trivial
    valuations. Rank-one valuations give nontrivial absolute values, and the
    associated absolute values are equivalent exactly when the valuations are,
    even for different ambient value groups.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Anchor
  license: Apache-2.0
sources:
  - title: "Valuation integers: power divisibility, dimension bound and rank converse"
    type: original-proof
    relationship: other
    note: >-
      Original Formal Frontier Lean arguments for standard valuation facts,
      with earlier project proofs and clients adapted into this library.
      This is not copied source text or a claim of endorsement by any
      external source author; no source-specific coverage is asserted.
  - title: Local Fields and Their Extensions
    authors:
      - I. B. Fesenko
      - S. V. Vostokov
    type: book
    location: Second edition, Chapter I, (3.5)–(3.6)
    relationship: adapts
    note: >-
      Normalized discrete valuation rigidity, geometric powers and topology
      recognition motivate the algebraic rigidity theorem, ring-general power
      criterion and heterogeneous division-ring equivalence theorem.
      Algebraic rigidity assumes a common cyclic-unit codomain and both
      valuations surjective; topology recognition concerns equivalence, not
      equality of normalized values. No source-specific coverage is asserted.
related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on
    note: >-
      Uses Mathlib valuation rank, integers, value-group, local-ring,
      ideal, Krull-dimension, discrete adic valuation and quotient APIs,
      cyclic ordered-group classification and integer ordered-automorphism
      uniqueness. The topology results use canonical valuative topologies,
      generated value groups and valuation uniform equivalences, and follow
      Michael Stoll's absolute-value identity-homeomorphism API and power-transfer argument.
      The real absolute-value construction uses the restricted-value embedding
      in RankLeOne data and, in rank one, agrees with the bundled norm of
      Valued.toNormedField.
  - id: https://github.com/FormalFrontier/spectral-stone-duality
    relationship: builds-on
    note: >-
      Provides the canonical generic-point topology Topology.WithGenericPoint
      used by the valuation spectrum homeomorphism.
automation:
  methods:
    - method: agent
      framework: Lean 4
      tool_setup: >-
        Agent-assisted Lean proof development and ordinary-import clients.
      prompting_notes: >-
        Formal Frontier agents developed proof expressions and examples using
        mathlib; the module guides distinguish original work and adaptations.
status:
  scope: >-
    Rank-at-most-one valuation integers satisfy positive power divisibility
    and a dimension-at-most-one bound; a dimension-at-most-one bound conversely
    supplies rank-at-most-one data. Arbitrary valuation families have an
    intersection subring, full residue maps and a unit criterion. Finite
    pointwise rank-at-most-one families have denominator, canonical
    localization, fraction-field and selected nontrivial-place residue
    surjectivity results without pairwise inequivalence. For nonempty finite
    families, maximal ideals are contracted without a rank restriction. Finite
    pointwise rank-at-most-one intersections have classified prime and maximal
    ideals, dimension at most one, a finite spectrum and an open-set criterion:
    an open is empty or contains the zero prime. Empty, repeated and trivial
    places are allowed. Separately, finite pairwise inequivalent rank-one
    families have weak approximation at positive restricted-value-group radii,
    full residue-product surjectivity and a homeomorphism from the canonical
    generic-point fork Topology.WithGenericPoint of Spectral Stone Duality
    to the spectrum. Diagonal uniformizers additionally
    require discreteness. These results about spectra are not a representation
    theorem. Equivalent surjective valuations of an arbitrary ring into a
    common linearly ordered commutative group with zero having cyclic units
    are equal, including trivial unit groups. Both surjectivity premises are
    essential for this algebraic rigidity theorem. For arbitrary rings,
    a rank-at-most-one valuative topology has powers tending to zero exactly
    at values less than one, without separation or ambient Archimedeanness.
    For division rings, two rank-at-most-one valuations are equivalent exactly
    when the specified underlying identity between their WithVal spaces is a
    homeomorphism. The value types may differ, and trivial valuations are
    included. The real absolute-value module constructs an AbsoluteValue on
    a division ring from rank-at-most-one data, reflects valuation comparisons
    including trivial valuations, and, in rank one, agrees with the bundled
    norm of Valued.toNormedField over a valued field. Rank-one valuations give
    nontrivial absolute values. The associated absolute values are equivalent
    exactly when the valuations are, even for different ambient value groups.
    The absolute-value metric is ultrametric, and the specified underlying
    ring identity compares WithVal v with WithAbs v.absoluteValue as uniform
    spaces. This comparison includes trivial valuations and chooses no
    topology on the original division ring or numerical normalization.
    Finite weak approximation uses this construction and transports arbitrary
    positive restricted-value radii through the same specified embedding.
    No source-specific coverage is asserted.
