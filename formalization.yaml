status:
  scope: >-
    Rank-at-most-one valuation integers satisfy positive power divisibility
    and a dimension-at-most-one bound; a dimension-at-most-one bound conversely
    supplies rank-at-most-one data. Arbitrary valuation families have an
    intersection subring, full residue maps and a unit criterion. Finite
    pointwise rank-at-most-one families have denominator, canonical
    localization, fraction-field and selected nontrivial-place residue
    surjectivity results without pairwise inequivalence. For nonempty finite
    families, maximal ideals are contracted without a rank restriction. Finite
    pointwise rank-at-most-one intersections have classified prime and maximal
    ideals, dimension at most one, a finite spectrum and an open-set criterion:
    an open is empty or contains the zero prime. Empty, repeated and trivial
    places are allowed. Separately, finite pairwise inequivalent rank-one
    families have weak approximation at positive restricted-value-group radii,
    full residue-product surjectivity and a homeomorphism from the canonical
    generic-point fork Topology.WithGenericPoint of Spectral Stone Duality
    to the spectrum. Diagonal uniformizers additionally
    require discreteness. These results about spectra are not a representation
    theorem. Equivalent surjective valuations of an arbitrary ring into a
    common linearly ordered commutative group with zero having cyclic units
    are equal, including trivial unit groups. Both surjectivity premises are
    essential for this algebraic rigidity theorem. For arbitrary rings,
    a rank-at-most-one valuative topology has powers tending to zero exactly
    at values less than one, without separation or ambient Archimedeanness.
    For division rings, two rank-at-most-one valuations are equivalent exactly
    when the specified underlying identity between their WithVal spaces is a
    homeomorphism. The value types may differ, and trivial valuations are
    included. The real absolute-value module constructs an AbsoluteValue on
    a division ring from rank-at-most-one data, reflects valuation comparisons
    including trivial valuations, and, in rank one, agrees with the bundled
    norm of Valued.toNormedField over a valued field. Rank-one valuations give
    nontrivial absolute values. The associated absolute values are equivalent
    exactly when the valuations are, even for different ambient value groups.
    The absolute-value metric is ultrametric, and the specified underlying
    ring identity compares WithVal v with WithAbs v.absoluteValue as uniform
    spaces. This comparison includes trivial valuations and chooses no
    topology on the original division ring or numerical normalization.
    Finite weak approximation uses this construction and transports arbitrary
    positive restricted-value radii through the same specified embedding.
    For valued fields with independently universed value groups, a dense field
    algebra map compatible through Valuation.HasExtension induces a dense stock
    integer algebra map and a bijective stock local residue map. No rank,
    discreteness, nontriviality, completeness or finite/perfect-residue assumption
    is required. The same-valuation equality on the uniform completion supplies
    its HasExtension instance. Its residue equivalence is RingEquiv.ofBijective
    over the induced map, characterized by its underlying homomorphism and
    reduction law. The rational two-adic client compares this integer map and
    residue equivalence with the specified p-adic comparisons: nonzero 2 is in
    the original maximal ideal and reduces to zero, while 1 survives. Integer-map
    surjectivity and principal-adic-completion comparisons are not asserted.
    Separately, for valued rings over an arbitrary common linearly ordered
    commutative group with zero, a dense additive homomorphism preserving raw
    values at every element, including zero, is uniform-inducing and uniformly
    continuous. No injectivity, multiplicativity, field, separation or completeness
    hypothesis is needed; ring valuations can have nonzero support. For a valued
    field K and a complete T0 valued ring L over the same group, a dense ring
    homomorphism f preserving raw values gives Valued.completionRingEquiv,
    a ring equivalence from UniformSpace.Completion K to L. Its forward map is
    Mathlib's Completion.extensionHom; its laws specify stock-extension, base and
    inverse-base equations, exact raw values and uniform continuity both ways,
    and uniqueness among continuous ring homomorphisms agreeing with f on K.
    No source completeness, target field, rank, normalization or surjectivity
    hypothesis is imposed. The Hahn-series client supplies independent canonical
    completion hypothesis witnesses without Hahn-field completeness, followed
    by a separate comparison API exercise. Prescribed-valuation extension existence,
    normalization, sequential Cauchy-quotient and neighborhood-basis constructions,
    negative-coordinate conversion, identifications with the book's original
    integer-ring and maximal-ideal carriers, and a join to residue transport are
    not supplied; the full Chapter I, section 4 completion construction is not assembled.
    For a complete normed field K and a commutative Noetherian coefficient
    ring R with compatible scalars and image containing K's norm unit ball, every bounded
    R-submodule of a finite-dimensional normed K-space is finitely generated. For a
    finite-dimensional normed K-algebra L with compatible valuation integers, Noetherian
    base integers, an integral base norm unit ball and norm-bounded extension integers,
    the extension integers form a finite module.
    For natural k and p with k positive, an explicit Fact p.Prime and
    p - 1 dividing 2k, the divided Bernoulli number B_(2k)/(2k) has additive
    p-adic valuation -1 - padicValNat p (2k). Its positive reduced Rat.den has
    padicValNat exponent 1 + padicValNat p (2k). The divisor is the even index
    2k, not the half-index k. At k = 1, independent examples compute the quotient
    as 1/12 and its denominator as 12, giving valuations -2 and -1 at the
    selected primes 2 and 3; the nonselected prime 5 is coprime to this denominator.
    These two formulas do not assert valuations at nonselected primes, a complete
    denominator product, prime congruences or a topological K-theory conclusion.
    For every n : Int and k : Nat with 0 < k, the rational number
    n^k * (n^k - 1) * (bernoulli k / k) is integral over Int. This includes
    zero and negative arguments and the index-one case with bernoulli 1 = -1/2.
    For q : Rat and k : Nat, integrality of n^k * (n^k - 1) * q for all natural
    n implies p - 1 divides k for every prime p dividing q.den. The zero
    exponent is included. Applied to divided Bernoulli numbers, this restricts
    prime support at every natural index, without computing exact denominator
    exponents. The model q = 1/12, k = 2 also shows why primality is necessary.
    The Power module gives a sharp power-root neighborhood over a Henselian valuation
    integer ring, with an exact correction value and strict correction bound. The
    root argument applies Adic Modules' generic Henselian-pair root estimate to
    X^m minus the target over the canonical valuation integers. The associated
    unit stays in that ring, giving the exact estimate for the original valuation.
    Openness of the stock power range in the canonical units topology for a
    nonzero exponent cast uses that root statement. No completeness, valuation
    rank, characteristic-zero or unit-derivative hypothesis is imposed. The
    two-adic model independently transports adic completeness from the standard
    integer ring and proves the valuation inputs for m = 2 and a = 17, including
    the nonunit derivative. Its root and openness clients then apply the public
    APIs. No new Newton theorem is introduced.
    For a valuation on a field with an arbitrary independently universed
    linearly ordered commutative value group with zero, the polynomial Hensel
    criteria use the original valuation subring, its maximal ideal m and the
    original valuation. For a polynomial f over that subring and a in it,
    Henselianity at that ideal and v(f(a)) < v(f'(a))^2 give a root b in the
    subring with v(b-a) < v(f'(a)), the identity
    v(f(a)) = v(f'(a)) * v(b-a), and v(f'(b)) = v(f'(a)). Every root c in the
    entire original ball v(c-a) < v(f'(a)) equals b. For every natural s,
    f(a) in m^(2*s+1) and f'(a) not in m^(s+1) give the same conclusions and
    b-a in m^(s+1). For e, d, z in that subring, the two algebraic comparisons
    do not assume Henselianity: e in m^(2*s+1) and d not in m^(s+1) imply
    v(e) < v(d)^2; under the same ideal hypotheses, v(e) = v(d) * v(z) implies
    z in m^(s+1). They include zero errors without an additional nonzero
    hypothesis. The root theorem combines these comparisons with the strict
    criterion. No completeness, rank, discreteness, Noetherianity, monicity,
    unit-derivative, residue-field or cofinality hypothesis is imposed, and no
    uniformizer or normalization is chosen.
    No source-specific coverage is asserted.
review:
  status: partially-agent-reviewed
  notes: >-
    The power, dimension, rigidity, topology and intersection results and
    their clients have independent agent review, as do the real absolute-value
    definition and theorem statements and the completion-residue definition
    and headline statements. No human review or source-coverage
    assessment is claimed.
    The power-neighborhood statements and proofs, including their
    independent two-adic inputs and clients, have independent agent review.
