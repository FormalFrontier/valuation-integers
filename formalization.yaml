# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"
project:
  name: Valuation Integers
  description: >-
    Power divisibility and a Krull-dimension bound for the integers of a
    rank-at-most-one valuation, a converse producing rank data from a
    dimension bound, and intersections of valuation subrings with full
    residue-field maps. Finite rank-at-most-one intersections have classified
    primes, dimension at most one and finite spectra whose nonempty opens
    contain zero. Finite pairwise inequivalent rank-one intersections have a
    separately hypothesized generic-point fork homeomorphism. Equivalent
    surjective valuations of a ring into a common cyclic-unit linearly ordered
    commutative group with zero are equal. A canonical rank-at-most-one
    valuative topology detects values less than one by convergence of powers;
    for division rings, the specified identity homeomorphism recognizes
    equivalence of two rank-at-most-one valuations. Valuations of rank at most
    one on division rings also have a real absolute-value construction using
    the specified rank embedding, with comparison lemmas including trivial
    valuations. Rank-one valuations give nontrivial absolute values, and the
    associated absolute values are equivalent exactly when the valuations are,
    even for different ambient value groups. Dense compatible valued-field
    extensions induce dense integer algebra maps and bijective residue maps,
    specializing to a reduction-compatible residue equivalence for the uniform
    completion at arbitrary valuation rank. A dense ring homomorphism preserving
    raw values exactly identifies the canonical completion of a valued field
    with a complete separated valued ring over an arbitrary common value group.
    Dense exactly value-preserving additive maps of valued rings induce uniformities.
    Bounded submodules of finite-dimensional
    normed spaces over complete fields are finitely generated over Noetherian coefficient
    rings whose images contain the norm unit ball, with an extension-integer application.
    At a positive even index 2k and a prime p with p - 1 dividing 2k, the divided
    Bernoulli number B_(2k)/(2k) has additive p-adic valuation -1 - v_p(2k)
    and positive reduced denominator exponent 1 + v_p(2k).
    For every integer n and positive natural k, the rational expression
    n^k * (n^k - 1) * (bernoulli k / k) is integral over the integers.
    More generally, if n^k * (n^k - 1) * q is integral for every natural n,
    every prime p in the reduced denominator of q satisfies p - 1 divides k.
    This includes k = 0 and applies to divided Bernoulli numbers at every index.
    For Henselian valuation integers, a sharp power-root neighborhood has an exact
    correction value, and the stock power range in the canonical units topology is
    open when the exponent has nonzero image in the field.
    For a valuation v on a field with any linearly ordered commutative value
    group with zero, assume v.valuationSubring is Henselian at its maximal ideal m.
    For a polynomial f over that subring and a in it, a strict squared-derivative
    value inequality gives a root b, the exact error/displacement identity,
    derivative-value equality and uniqueness throughout the original derivative ball.
    For every natural s, f(a) in m^(2*s+1) and f'(a) not in
    m^(s+1) give all these conclusions and b-a in m^(s+1), without completeness,
    rank, discreteness, Noetherianity, monicity or unit-derivative assumptions.
    For e, d, z in that subring, two algebraic comparisons require no Henselianity:
    e in m^(2*s+1) and d not in m^(s+1) imply v(e) < v(d)^2, and under the same
    hypotheses the identity v(e) = v(d) * v(z) implies z in m^(s+1).
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Formal Frontier Agents
  license: Apache-2.0
sources:
  - title: "Valuation integers: power divisibility, dimension bound and rank converse"
    type: original-proof
    relationship: other
    note: >-
      Original Formal Frontier Lean arguments for standard valuation facts,
      with earlier project proofs and clients adapted into this library.
      This is not copied source text or a claim of endorsement by any
      external source author; no source-specific coverage is asserted.
  - title: Local Fields and Their Extensions
    authors:
      - I. B. Fesenko
      - S. V. Vostokov
    type: book
    location: Second edition (2002), Chapter I, (3.5)–(3.6), (4.2)–(4.4), (4.5)(1); Chapter II, §1, Corollary 4 and subsequent Remark, and §2
    relationship: adapts
    note: >-
      Normalized discrete valuation rigidity, geometric powers and topology
      recognition motivate the algebraic rigidity theorem, ring-general power
      criterion and heterogeneous division-ring equivalence theorem.
      Algebraic rigidity assumes a common cyclic-unit codomain and both
      valuations surjective; topology recognition concerns equivalence, not
      equality of normalized values. Completion, integer density and induced
      residue-field identification motivate the completion-residue API and
      rational two-adic example. The arbitrary-rank dense-extension formulation
      generalizes the completion residue assertion. The separate canonical
      completion comparison assumes a given dense exactly value-preserving ring
      homomorphism into a complete separated valued ring, with uniqueness among
      continuous ring homomorphisms agreeing on the base. It does not construct
      an extension of a prescribed valuation or the book's sequence-quotient model.
      No source-specific coverage is asserted, and no redistribution license
      for the book is inferred.
      The finite-extension integer-ring argument
      motivates bounded-submodule finite generation over complete normed fields and its
      normed-ring application with separate norm cutoffs.
      The power-neighborhood statements strengthen the printed
      characteristic-zero discrete corollary and its Henselian discrete Remark
      to arbitrary valuation rank and positive characteristic with nonzero
      exponent cast, with an exact correction value under the strict inequality.
  - title: Local Fields and Their Extensions
    authors:
      - I. B. Fesenko
      - S. V. Vostokov
    type: book
    location: Second edition (2002), Chapter II, §1, Corollary 3, p. 37
    relationship: adapts
    note: >-
      The printed result assumes a complete discrete valuation field, a monic
      polynomial and an integer s >= 0 with f(a) in m^(2*s+1) and f'(a) not in
      m^(s+1), and gives a root with b-a in m^(s+1). The derivative order is at
      most s, not necessarily exactly s. Here Henselianity of the original
      valuation subring replaces the complete and discrete hypotheses, and
      monicity is unnecessary. Algebraic power/value comparisons give the strict
      inequality v(f(a)) < v(f'(a))^2 and recover b-a in m^(s+1) from the sharp
      error/displacement identity. The root also has derivative-value equality
      and uniqueness throughout the original derivative ball at arbitrary rank.
      Establishing Henselianity from completeness in the printed setting remains
      a separate specialization.
  - title: Vector Bundles and K-Theory
    authors:
      - Allen Hatcher
    type: book
    location: Version 2.2 (November 2017), §4.1, Lemma 4.12, printed p. 117, and the following argument in the proof of Theorem 4.9
    relationship: adapts
    note: >-
      Theorem 4.9 supplies the selected-prime denominator conclusions for divided
      Bernoulli numbers at positive even indices. These formulas concern primes
      p with p - 1 dividing the even index, using Mathlib's undivided Bernoulli
      valuation and rational valuation APIs.
      The Bernoulli integrality statement for all integer arguments and positive
      natural indices, proved by the logarithmic-derivative method using finite
      exponential sums and integer Euler-polynomial numerators. The index-one
      case uses Mathlib's convention bernoulli 1 = -1/2. The following
      prime-cancellation argument is generalized to an arbitrary rational
      coefficient whose products n^k * (n^k - 1) * q are integral for every
      natural n. It bounds prime support, not exact denominator exponents.
      No source prose or PDF is reproduced, no redistribution license for the
      book is inferred, and no source-specific coverage is asserted.
related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on
    note: >-
      Uses Mathlib valuation rank, integers, value-group, local-ring,
      ideal, Krull-dimension, discrete adic valuation and quotient APIs,
      cyclic ordered-group classification and integer ordered-automorphism
      uniqueness. The topology results use canonical valuative topologies,
      generated value groups and valuation uniform equivalences, and follow
      Michael Stoll's absolute-value identity-homeomorphism API and power-transfer argument.
      The real absolute-value construction uses the restricted-value embedding
      in RankLeOne data and, in rank one, agrees with the bundled norm of
      Valued.toNormedField. Completion-residue transport uses the extended
      valuation and its exact restriction equality, HasExtension integer algebra
      and locality instances, the residue-field functor, quotient topology for
      open subgroups, dense-to-discrete surjectivity and specified p-adic
      completion, integer and reduction comparisons. The canonical completion
      comparison reuses UniformSpace.Completion.extensionHom and
      IsDenseInducing.extendRingHom; exact raw values use nonzero local constancy
      and the dense base, without continuity into the ambient value group.
      Bounded-module finiteness uses finite-dimensional continuous coordinates,
      operator-norm bounds, scalar restriction and Noetherian submodule finiteness.
      Divided Bernoulli formulas use Bernoulli.padicValRat_bernoulli for the
      undivided number, padicValRat.div and padicValRat.of_nat for division by
      the index, and padicValRat_def with Rat.num_or_den_zero_padicVal for the
      positive reduced denominator exponent.
      Bernoulli integrality uses the Bernoulli generating function, formal power
      series, polynomial derivations and rational-integrality APIs. Rational
      denominator support uses integer witnesses for integral rational numbers,
      reduced numerator-denominator coprimality and the exponent and cardinality
      of the cyclic group of units of a finite field.
      The strong polynomial-root criterion uses valuation-integer strict
      divisibility, nonunit membership in the maximal ideal, mutual
      divisibility for equality of original values and linear root factorization.
      The power comparisons use Submodule.mul_induction_on and
      ValuationRing.dvd_total to show that each x in m^n is divisible by t^n
      for some t in m; strict divisibility also supplies the power/value lower
      bound. These are APIs of Mathlib at revision
      83abb3e776bdefcbc447a1e44d0debe4010039e5.
  - id: https://github.com/FormalFrontier/spectral-stone-duality
    relationship: builds-on
    note: >-
      Provides the canonical generic-point topology Topology.WithGenericPoint
      used by the valuation spectrum homeomorphism.
  - id: https://github.com/FormalFrontier/adic-modules
    relationship: builds-on
    note: >-
      The Power module applies its generic Henselian-pair root-lifting API over
      the canonical valuation integers. The association's integral unit witness
      supplies the exact correction value for the original valuation.
      The polynomial Hensel criterion reuses
      HenselianRing.exists_root_of_eval_mem_span_derivative_sq_mul for root,
      displacement and error association, and
      Polynomial.associated_eval_of_sub_mem_span_mul for derivative association
      and uniqueness through the remaining linear-root factor, from Adic Modules
      at revision 4e50b3b03c0c3ce11498774d72e111654ff35d08. The power-ideal root
      theorem combines this strict criterion with the algebraic power/value
      comparisons.
