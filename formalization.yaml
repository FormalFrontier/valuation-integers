acknowledgements: >-
  Formal Frontier contributors developed the original proof expressions,
  ordinary-import clients and independently assessed mathematical plans;
  destination contributors adapted them into this library. The module
  guides distinguish their roles and credit mathlib contributors, including
  Jingting Wang, Mario Carneiro, María Inés de Frutos-Fernández,
  Filippo A. E. Nuccio, Antoine Chambert-Loir, Yakov Pechersky and Kenny Lau.
  Mathlib supplies rank, valuation, local-ring and dimension foundations
  and retains its contributors' Apache-2.0 notices. The finite-intersection
  motivation follows Stefan Schröer's presentation, with antecedent credit
  to Y. Ershov conveyed through Schröer rather than direct consultation.
  The valuation-topology arguments adapt Fesenko–Vostokov and follow Mathlib's
  geometric-power convergence, valuation uniform equivalences and Michael
  Stoll's absolute-value topology-recognition proof. The completion-residue
  arguments generalize the Fesenko–Vostokov completion residue assertion using
  Mathlib's supplied valued-field completion and integer, locality, residue,
  dense-image and discrete-quotient APIs; the rational two-adic example uses
  Mathlib's specified p-adic comparisons and reduction maps. The completion
  comparison reuses Mathlib's UniformSpace.Completion.extensionHom and
  IsDenseInducing.extendRingHom machinery; the Hahn-series client uses its
  HahnSeries, AddValuation.toValuation, WithVal and canonical completion APIs.
  The quadratic 5-adic client follows
  the polynomial and valuation-parity construction in the norm-forms spectral-norm example.
  The divided Bernoulli results follow the selected-prime conclusions of Hatcher's
  Theorem 4.9 and reuse Mathlib's undivided Bernoulli valuation, rational valuation
  and reduced-denominator arguments.
  Bernoulli integrality follows Hatcher's logarithmic-derivative method using
  Mathlib's Bernoulli generating function, formal power series, polynomial
  derivations and rational-integrality APIs. The rational denominator-support
  criterion generalizes Hatcher's prime-cancellation argument using Mathlib's
  rational-root, coprimality, finite-field cyclicity and group-exponent APIs.
  The power-neighborhood
  statements draw on Fesenko–Vostokov II§1; their model uses Mathlib's norm
  valuation, p-adic integer completeness and Henselian ring instance. The numeric
  input is the valuation representation of the same m = 2, a = 17 input already
  used by Polynomial Root Stability, without reproducing its polynomial fixture
  or using its root output. The power-root argument reuses Adic Modules'
  Henselian-pair root estimate and Mathlib's valuation-integer unit criterion.
