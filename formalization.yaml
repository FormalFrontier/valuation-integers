# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"
project:
  name: Valuation Integers
  description: >-
    Power divisibility and a Krull-dimension bound for the integers of a
    rank-at-most-one valuation, and a converse producing rank data from a
    dimension bound, including field and trivial-valuation cases.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Anchor
  license: Apache-2.0
sources:
  - title: "Valuation integers: power divisibility, dimension bound and rank converse"
    type: original-proof
    relationship: other
    note: >-
      Original Formal Frontier Lean arguments for standard valuation facts,
      with earlier project proofs and clients adapted into this library.
      This is not copied source text or a claim of endorsement by any
      external source author; no source-specific coverage is asserted.
related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on
    note: >-
      Uses native valuation rank, integers, value-group, local-ring,
      ideal and Krull-dimension APIs.
automation:
  methods:
    - method: agent
      framework: Formal Frontier Hive Tasks and Lean 4
      tool_setup: >-
        Agent-assisted Lean proof development and ordinary-import clients,
        with independent review and a pinned standalone mathlib-only project.
      prompting_notes: >-
        Original Formal Frontier proof expression and clients were adapted
        into the standalone library; the three public statements and their
        separate private clients are identified in the shipped modules.
status:
  scope: >-
    Three public theorems and separate ordinary-import private clients are
    present: power divisibility and a forward dimension bound under a
    rank-at-most-one assumption, and a converse yielding rank data from a
    dimension-at-most-one bound. Published mathematical inputs received
    independent agent review and native both-root/complete transitive
    standard-axiom checks, including private/generated declarations. These
    checks are revision-specific, not certification of later edits. No
    source-specific coverage is asserted.
review:
  status: agent-reviewed
  notes: >-
    Independent agent reviews covered the mathematical inputs at the
    published three-result release 09c63e5f9622f483393edc40c5bbc672308db0eb;
    no human review is claimed. Review and build/axiom evidence apply only
    to their exact revisions and inputs; later affected edits need their
    own applicable assessment.
alignment:
  namespace: Valuation.Integers
  note: >-
    Public library API inventory, not a source-passage or coverage mapping.
    Private client fixtures and imported mathlib declarations are excluded.
  statements:
    - lean: Valuation.Integers.exists_pos_pow_dvd_of_mem_maximalIdeal
      module: ValuationIntegers/RankLeOnePower.lean
    - lean: Valuation.Integers.krullDimLE_one
      module: ValuationIntegers/RankLeOneDimension.lean
    - lean: Valuation.Integers.nonempty_rankLeOne_of_krullDimLE_one
      module: ValuationIntegers/RankLeOneConverse.lean
acknowledgements: >-
  Formal Frontier contributors developed the original proof expressions,
  ordinary-import clients and independently assessed mathematical plans;
  destination contributors adapted them into this library. The module
  guides distinguish their roles and credit mathlib contributors, including
  Jingting Wang, Mario Carneiro, María Inés de Frutos-Fernández,
  Filippo A. E. Nuccio, Antoine Chambert-Loir, Yakov Pechersky and Kenny Lau.
  Mathlib supplies native rank, valuation, local-ring and dimension foundations
  and retains its contributors' Apache-2.0 notices.
