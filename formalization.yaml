# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"
project:
  name: Valuation Integers
  description: >-
    Power divisibility and a Krull-dimension bound for the integers of a
    rank-at-most-one valuation, and a converse producing rank data from a
    dimension bound, including field and trivial-valuation cases.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Anchor
  license: Apache-2.0
sources:
  - title: "Valuation integers: power divisibility, dimension bound and rank converse"
    type: original-proof
    relationship: other
    note: >-
      Original Formal Frontier Lean arguments for standard valuation facts,
      transferred from reviewed project code and an accepted isolated donor;
      no named source passage or source-specific coverage is asserted here.
related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on
    note: >-
      Uses native valuation rank, integers, value-group, local-ring,
      ideal and Krull-dimension APIs.
automation:
  methods:
    - method: agent
      framework: Formal Frontier Hive Tasks and Lean 4
      tool_setup: >-
        Original project proofs and ordinary-import clients, independent
        isolated donor review, and static transfer into a pinned standalone
        mathlib-only project.
      prompting_notes: >-
        The converse producer preserves the donor bytes; its private client
        retargets only the import and namespace, with new library root imports
        and documentation. The old public statements and proofs remain fixed.
status:
  scope: >-
    Three public declarations and separate ordinary-import private clients
    are inventoried. The original two-result standalone
    destination mathematical base passed native both-root and full
    private/generated-inclusive standard-axiom verification, independent
    destination agent review and maintainer content acceptance before
    integration into development main and its official first release.
    The converse destination transfer subsequently passed its own independent
    semantic review, both-root build and complete transitive standard-axiom
    audit of all eight modules and 24 declarations including 21 private/generated
    declarations, then received maintainer acceptance and development integration.
    Release/publication decisions remain separate; no source coverage is asserted.
review:
  status: agent-reviewed
  notes: >-
    The original destination mathematical base, isolated converse donor and
    exact converse destination transfer received independent agent reviews;
    no human review is claimed. Later affected documentation, metadata and
    release artifacts require their own applicable assessment.
alignment:
  namespace: Valuation.Integers
  note: >-
    Public library API inventory, not a source-passage or coverage mapping.
    Private client fixtures and imported mathlib declarations are excluded.
  statements:
    - lean: Valuation.Integers.exists_pos_pow_dvd_of_mem_maximalIdeal
      module: ValuationIntegers/RankLeOnePower.lean
    - lean: Valuation.Integers.krullDimLE_one
      module: ValuationIntegers/RankLeOneDimension.lean
    - lean: Valuation.Integers.nonempty_rankLeOne_of_krullDimLE_one
      module: ValuationIntegers/RankLeOneConverse.lean
acknowledgements: >-
  Original Formal Frontier worker-b Hive Tasks authored the two proofs and
  maintained clients of the first release; another worker-b Task authored
  the isolated converse proof and clients. Module guides retain their
  mathematical and original-project credit, including Jingting Wang,
  Mario Carneiro, María Inés de Frutos-Fernández, Filippo A. E. Nuccio,
  Antoine Chambert-Loir and Kenny Lau. Mathlib supplies the native rank,
  valuation, local-ring and dimension foundations and retains its authors'
  Apache-2.0 notices.
