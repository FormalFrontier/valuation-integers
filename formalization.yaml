version: "v0.4"
project:
  name: Valuation Integers
  description: >-
    Power divisibility and a Krull-dimension bound for the integers of a
    rank-at-most-one valuation, a converse producing rank data from a
    dimension bound, and intersections of valuation subrings with full
    residue-field maps, including empty-family and finite-field cases.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Anchor
  license: Apache-2.0
sources:
  - title: "Valuation integers: power divisibility, dimension bound and rank converse"
    type: original-proof
    relationship: other
    note: >-
      Original Formal Frontier Lean arguments for standard valuation facts,
      with earlier project proofs and clients adapted into this library.
      This is not copied source text or a claim of endorsement by any
      external source author; no source-specific coverage is asserted.
related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on
    note: >-
      Uses native valuation rank, integers, value-group, local-ring,
      ideal, Krull-dimension, discrete adic valuation and quotient APIs.
automation:
  methods:
    - method: agent
      framework: Formal Frontier Hive Tasks and Lean 4
      tool_setup: >-
        Agent-assisted Lean proof development and ordinary-import clients,
        with independent review and a pinned standalone mathlib-only project.
      prompting_notes: >-
        Original Formal Frontier proof expression and clients were adapted
        into the standalone library; the three earlier rank/dimension
        statements and their separate private clients, as well as the added
        finite-intersection results, are identified in the shipped modules.
status:
  scope: >-
    Power divisibility and a forward dimension bound under a rank-at-most-one
    assumption, and a converse yielding rank data from a dimension-at-most-one
    bound, have separate ordinary-import clients. The intersection subring,
    inclusions, full residue maps and contracted kernels have independent
    empty-, singleton- and duplicate-family clients. For finite pairwise
    inequivalent rank-one families, weak approximation is proved at positive
    dependent radii in each valuation's restricted value group and yields
    surjectivity onto the full residue product and its quotient equivalence.
    The arbitrary-family unit, canonical algebra/tower, prime-contraction and
    equivalent-place contraction results are proved. Finite rank-at-most-one
    denominator, canonical localization, fraction-field and selected nontrivial
    residue surjectivity statements are proved by reducing to distinct nontrivial
    equivalence classes. Their instances, individual quotient/maximality results
    and original explicit-independent individual residue wrappers follow
    from these proofs.
    For nonempty finite families every maximal ideal is contracted without a
    rank restriction; the converse can fail at higher rank. For finite
    pointwise rank-at-most-one families, every prime is zero or contracted,
    and the intersection has Krull dimension at most one, including empty
    families. Zero is maximal exactly when all places are trivial; nontrivial
    selected places yield maximal contracted ideals, while a trivial place in
    a mixed family contracts to nonmaximal zero. Repeated valuations may yield
    equal contractions.
    Pairwise coprimality retains the finite, pairwise-inequivalent, rank-one
    hypotheses and uses distinctness of the contracted maximal ideals.
    For finite families of pairwise inequivalent rank-one
    discrete valuations, chosen diagonal uniformizers have independent
    proofs. Empty, all-trivial, duplicate and mixed trivial/2-adic
    families provide boundary clients, including a failure of surjectivity and
    maximality at the trivial selected place. The rational-function example
    independently establishes discreteness,
    inequivalence, explicit generators and the failure of arbitrary positive
    ambient radii; its cross-place inverse exercises canonical localization.
    The three earlier mathematical inputs received
    independent agent review and native both-root/complete transitive
    standard-axiom checks, including private/generated declarations. These
    checks are revision-specific, not certification of these changed proofs. No
    source-specific coverage is asserted.
