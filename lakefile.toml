name = "valuation-integers"
version = "0.1.0"
defaultTargets = ["ValuationIntegers", "ValuationIntegersTest"]
lintDriver = "batteries/runLinter"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "spectral-stone-duality"
git = "https://github.com/FormalFrontier/spectral-stone-duality.git"
rev = "d7dad16f9308a468bb964c0f13caf896a780621d"

[[require]]
name = "adic-modules"
git = "https://github.com/FormalFrontier/adic-modules.git"
rev = "2fb498d13a8195ddd32e0462f7983828f61aece1"

[[lean_lib]]
name = "ValuationIntegers"
roots = [
  "ValuationIntegers",
  "ValuationIntegers.AbsoluteValue.Bounded",
  "ValuationIntegers.AbsoluteValue.NatPrimePower",
  "ValuationIntegers.AbsoluteValue.UnitBound"
]

[[lean_lib]]
name = "ValuationIntegersTest"
roots = ["ValuationIntegersTest", "ValuationIntegersTest.Cauchy.UniformCompletion", "ValuationIntegersTest.Valuation.AbsoluteValueEquiv"]
# Test assertions are intentionally private.
leanOptions = { weak.linter.privateModule = false }

[[require]]
name = "groupTheory"
git = "https://github.com/FormalFrontier/group-theory.git"
rev = "4791da691c8cf6f7bf40caf2606e17e46b432e08"

[[require]]
name = "norm-forms"
git = "https://github.com/FormalFrontier/norm-forms.git"
rev = "81579a768804dc6be501bfcb4fe044159ae45e50"

[[require]]
name = "coherent-modules"
git = "https://github.com/FormalFrontier/coherent-modules.git"
rev = "0bcb335a180c39e599086aefb505efbe84523e2f"

[[require]]
name = "multivariate-polynomials"
git = "https://github.com/FormalFrontier/multivariate-polynomials.git"
rev = "5d58abb977f3281238ee5b4f37303a275b1b2426"

[[require]]
name = "finite-group-tate-cohomology"
git = "https://github.com/FormalFrontier/finite-group-tate-cohomology.git"
rev = "c0c9d563d45adfa81bff78821042089f750b1d44"
