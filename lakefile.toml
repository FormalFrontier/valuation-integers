name = "valuation-integers"
version = "0.1.0"
defaultTargets = ["ValuationIntegers", "ValuationIntegersTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "spectral-stone-duality"
git = "https://github.com/FormalFrontier/spectral-stone-duality.git"
rev = "d7dad16f9308a468bb964c0f13caf896a780621d"

[[lean_lib]]
name = "ValuationIntegers"

[[lean_lib]]
name = "ValuationIntegersTest"
