name = "valuation-integers"
version = "0.1.0"
defaultTargets = ["ValuationIntegers", "ValuationIntegersTest"]
lintDriver = "batteries/runLinter"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "spectral-stone-duality"
git = "https://github.com/FormalFrontier/spectral-stone-duality.git"
rev = "d7dad16f9308a468bb964c0f13caf896a780621d"

[[require]]
name = "adic-modules"
git = "https://github.com/FormalFrontier/adic-modules.git"
rev = "4e50b3b03c0c3ce11498774d72e111654ff35d08"

[[lean_lib]]
name = "ValuationIntegers"
roots = [
  "ValuationIntegers",
  "ValuationIntegers.AbsoluteValue.Bounded",
  "ValuationIntegers.AbsoluteValue.NatPrimePower",
  "ValuationIntegers.AbsoluteValue.UnitBound"
]

[[lean_lib]]
name = "ValuationIntegersTest"
roots = ["ValuationIntegersTest", "ValuationIntegersTest.Cauchy.UniformCompletion", "ValuationIntegersTest.Valuation.AbsoluteValueEquiv"]
# Test assertions are intentionally private.
leanOptions = { weak.linter.privateModule = false }

[[require]]
name = "groupTheory"
git = "https://github.com/FormalFrontier/group-theory.git"
rev = "cf4d26b5a4540755d233bde02ae6826121357264"
